<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ben Monday - Contact</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,400&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <canvas id="stars"></canvas>

  <nav>
    <a href="index.html" class="nav-logo">benmonday.dev</a>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="projects.html">Projects</a></li>
      <!-- <li><a href="artwork.html">Artwork</a></li> -->
      <li><a href="about.html">About Me</a></li>
      <li><a href="contact.html">Contact Me</a></li>
    </ul>
  </nav>

  <main>
    <div class="container">
      <div class="contact-layout">

        <div class="contact-intro">
          <h2>Contact Me</h2>
          <h1 style="font-size:42px;">Let's get in touch!</h1>
          <p style="margin-top: 16px;">
            I am happy to answer any questions anyone might have about my work or projects, and am always open to collaborating/discussing with fellow devs!
          </p>

          <div class="contact-method">
            <div class="method-item">
              <span class="method-label">Email</span>
              <a href="mailto:benmonday965@gmail.com" class="method-value">benmonday965@gmail.com</a>
            </div>
          </div>
        </div>

        <form class="contact-form" id="contact-form" onsubmit="handleSubmit(event)">
          <div class="form-group">
            <label for="name">Name</label>
            <input type="text" id="name" name="name" placeholder="Your Name" required />
          </div>
          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="you@example.com" required />
          </div>
          <div class="form-group">
            <label for="subject">Subject</label>
            <input type="text" id="subject" name="subject" placeholder="Subject" />
          </div>
          <div class="form-group">
            <label for="message">Message</label>
            <textarea id="message" name="message" placeholder=". . ." required></textarea>
          </div>
          <button type="submit" class="btn btn-fill form-submit">Send message →</button>
          <p id="form-status" style="margin-top:12px; font-size:14px; display:none;"></p>
        </form>

      </div>
    </div>
  </main>

  <script>
    const page = window.location.pathname.split('/').pop() || 'index.html';
    document.querySelectorAll('.nav-links a').forEach(a => {
      if (a.getAttribute('href') === page) a.classList.add('active');
    });

    async function handleSubmit(e) {
      e.preventDefault();
      const form = e.target;
      const btn = form.querySelector('[type="submit"]');
      const status = document.getElementById('form-status');

      btn.textContent = 'Sending…';
      btn.disabled = true;

      try {
        const res = await fetch('https://formspree.io/f/xdajzrry', {
          method: 'POST',
          body: new FormData(form),
          headers: { 'Accept': 'application/json' }
        });

        if (res.ok) {
          btn.textContent = 'Sent ✓';
          btn.style.opacity = '0.6';
          form.reset();
          status.textContent = 'Thanks for reaching out! I\'ll get back to you as soon as I can!';
          status.style.color = '#7ecfad';
        } else {
          throw new Error();
        }
      } catch {
        btn.textContent = 'Send message →';
        btn.disabled = false;
        status.textContent = 'Something went wrong. Please try again or email me directly.';
        status.style.color = '#e07a7a';
      }

      status.style.display = 'block';
    }
  </script>

</body>
</html>
